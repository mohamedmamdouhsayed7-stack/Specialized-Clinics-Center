name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic_test_user
          POSTGRES_PASSWORD: clinic_test_password
          POSTGRES_DB: clinic_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_test_user -d clinic_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm exec --workspace=apps/api prisma migrate deploy -- --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://clinic_test_user:clinic_test_password@localhost:5432/clinic_test_db
      - run: npm run lint --workspace=apps/api
      - run: npm run lint --workspace=apps/web
      - run: npm test --workspace=apps/api -- --runInBand
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://clinic_test_user:clinic_test_password@localhost:5432/clinic_test_db
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret
      - run: npm run build:shared
      - run: npm run build:api
      - run: npm run build:web
      - run: npm exec --workspace=apps/api prisma validate -- --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://clinic_test_user:clinic_test_password@localhost:5432/clinic_test_db
